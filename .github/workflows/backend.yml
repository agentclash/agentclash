name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "runtime/**"
      - "scripts/db/**"
      - "scripts/dev/bootstrap.sh"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "runtime/**"
      - "scripts/db/**"
      - "scripts/dev/bootstrap.sh"
      - "Makefile"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests (short mode)
        run: go test -short -race -count=1 ./...

  migrations:
    name: PostgreSQL Migration Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Isolated database and migrator image checks
        working-directory: .
        run: python3 scripts/db/test-migrator.py

  docker:
    # The production images build from the REPO ROOT context because backend/
    # replaces the shared runtime module with ../runtime. Building them here
    # catches context breakage that `go build` cannot see (it broke silently
    # between 2026-07-02 and 2026-08-08).
    name: Docker Images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build api-server image
        run: docker build -f backend/Dockerfile --build-arg TARGET=api-server .

      - name: Build worker image
        run: docker build -f backend/Dockerfile.worker .
