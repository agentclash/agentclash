name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
      # External inputs that generated docs and public content read at build time.
      - "SECURITY.md"
      - "backend/.env.example"
      - "backend/internal/api/config.go"
      - "backend/internal/worker/config.go"
      - "try-cli/demos/**"
      - "docs/api-server/openapi.yaml"
      - "docs/schemas/**"
      - "cli/**"
      - "docs/marketing/**"
      - "examples/challenge-packs/**"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
      # External inputs that generated docs and public content read at build time.
      - "SECURITY.md"
      - "backend/.env.example"
      - "backend/internal/api/config.go"
      - "backend/internal/worker/config.go"
      - "try-cli/demos/**"
      - "docs/api-server/openapi.yaml"
      - "docs/schemas/**"
      - "cli/**"
      - "docs/marketing/**"
      - "examples/challenge-packs/**"

defaults:
  run:
    working-directory: web

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          # New cache when packages or source change; restore-keys lets a source-only
          # change fall back to the most recent cache for the same lockfile.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**/*.{js,jsx,ts,tsx}', 'web/*.config.{js,ts,mjs,cjs}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-

      - name: Production build and anonymous SEO crawl
        run: npm run check:seo-smoke

  seo-tests:
    name: SEO tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Authoring checks
        run: |
          npm run check:docs-links
          npm run check:content-dates

      - name: Focused SEO tests
        run: >-
          npx vitest run --maxWorkers=2
          src/app/sitemap.test.ts
          src/app/sitemap-registry.test.ts
          src/app/publications/sitemap.xml/route.test.ts
          src/lib/publication-data.test.ts
          src/lib/public-content.test.ts
          src/lib/public-http.test.ts
          src/app/seo-landing-pages.test.tsx
          src/lib/seo-pages/registry.test.ts
          src/lib/seo-crawl.test.ts
          src/lib/docs-links.test.ts
          src/lib/docs-authoring.test.ts
          src/app/public-navigation.test.tsx
          src/lib/content-dates-validation.test.ts
          src/lib/blog-listing-dates.test.ts
          src/app/blog/blog-metadata.test.ts
          src/app/blog/blog-post-schema.test.tsx
          src/lib/benchmarks.test.ts
          src/app/benchmarks/benchmarks-metadata.test.ts
