name: AWS release checks
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_call: {}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      backend: ${{ steps.select.outputs.backend }}
      runtime: ${{ steps.select.outputs.runtime }}
      cli: ${{ steps.select.outputs.cli }}
      terminal: ${{ steps.select.outputs.terminal }}
      frontend: ${{ steps.select.outputs.frontend }}
      platform: ${{ steps.select.outputs.platform }}
      images: ${{ steps.select.outputs.images }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      run: python3 delivery/changes.py select
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - name: Run required backend checks
      run: python3 delivery/checks.py backend
  runtime:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: runtime/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - name: Run required runtime checks
      run: python3 delivery/checks.py runtime
  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: cli/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - name: Run required cli checks
      run: python3 delivery/checks.py cli
  terminal:
    needs: changes
    if: ${{ needs.changes.outputs.terminal == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Run required terminal checks
      run: python3 delivery/checks.py terminal
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Run required frontend checks
      run: python3 delivery/checks.py frontend
  platform:
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install validation dependencies
      run: |-
        python3 -m venv "$RUNNER_TEMP/aws-checks-venv"
        "$RUNNER_TEMP/aws-checks-venv/bin/pip" install --disable-pip-version-check cfn-lint==1.56.3 PyYAML==6.0.3 ruff==0.16.7
        echo "$RUNNER_TEMP/aws-checks-venv/bin" >> "$GITHUB_PATH"
    - name: Run required platform checks
      run: python3 delivery/checks.py platform
  images:
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Install rehearsal dependency
      run: |-
        python3 -m venv "$RUNNER_TEMP/aws-image-venv"
        "$RUNNER_TEMP/aws-image-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
        echo "$RUNNER_TEMP/aws-image-venv/bin" >> "$GITHUB_PATH"
    - name: Run required images checks
      run: python3 delivery/checks.py images
  required:
    name: Release checks
    if: ${{ always() }}
    needs:
    - changes
    - backend
    - runtime
    - cli
    - terminal
    - frontend
    - platform
    - images
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require all selected checks
      env:
        CHECK_PLAN: ${{ needs.changes.outputs.plan }}
        CHECK_RESULTS: ${{ toJSON(needs) }}
      run: python3 delivery/changes.py aggregate
