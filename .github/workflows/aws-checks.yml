name: AWS release checks
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_call: {}
# A new push to a PR stops the old run. In a workflow_call, github.workflow is
# the caller (aws-release.yml), so a release run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      backend: ${{ steps.select.outputs.backend }}
      runtime: ${{ steps.select.outputs.runtime }}
      cli: ${{ steps.select.outputs.cli }}
      terminal: ${{ steps.select.outputs.terminal }}
      frontend: ${{ steps.select.outputs.frontend }}
      platform: ${{ steps.select.outputs.platform }}
      images: ${{ steps.select.outputs.images }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      run: python3 delivery/changes.py select
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Each part runs on its own runner. The aggregate sees one result for the
    # matrix: success only if every part passes.
    strategy:
      fail-fast: false
      matrix:
        part: [compile, test, migrator]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - name: Run required backend checks
      run: python3 delivery/checks.py backend --part ${{ matrix.part }}
  runtime:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Each part runs on its own runner. The aggregate sees one result for the
    # matrix: success only if every part passes.
    strategy:
      fail-fast: false
      matrix:
        part: [compile, test]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: runtime/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - name: Run required runtime checks
      run: python3 delivery/checks.py runtime --part ${{ matrix.part }}
  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: cli/go.mod
        cache-dependency-path: |-
          backend/go.sum
          runtime/go.sum
          cli/go.sum
    - name: Run required cli checks
      run: python3 delivery/checks.py cli
  terminal:
    needs: changes
    if: ${{ needs.changes.outputs.terminal == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Run required terminal checks
      run: python3 delivery/checks.py terminal
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Each part runs on its own runner. The aggregate sees one result for the
    # matrix: success only if every part passes.
    strategy:
      fail-fast: false
      matrix:
        part: [test, static, build]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Run required frontend checks
      run: python3 delivery/checks.py frontend --part ${{ matrix.part }}
  platform:
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install validation dependencies
      run: |-
        python3 -m venv "$RUNNER_TEMP/aws-checks-venv"
        "$RUNNER_TEMP/aws-checks-venv/bin/pip" install --disable-pip-version-check cfn-lint==1.56.3 PyYAML==6.0.3 ruff==0.16.7
        echo "$RUNNER_TEMP/aws-checks-venv/bin" >> "$GITHUB_PATH"
    - name: Run required platform checks
      run: python3 delivery/checks.py platform
  images:
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Configure the reviewed image export engine
      uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
      with:
        version: v29.3.1
        daemon-config: '{"debug":false,"log-level":"fatal","features":{"containerd-snapshotter":true}}'
    # The rehearsals compile `go test -race -tags=awsplatform` on the runner.
    # The shared setup-go key holds the build cache of whichever job saved it
    # first, so this job keeps its own Go cache.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: backend/go.mod
        cache: false
    - name: Restore the Go cache of the image rehearsals
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-image-rehearsals-v1-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'runtime/go.sum') }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Install rehearsal dependency
      run: |-
        python3 -m venv "$RUNNER_TEMP/aws-image-venv"
        "$RUNNER_TEMP/aws-image-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
        echo "$RUNNER_TEMP/aws-image-venv/bin" >> "$GITHUB_PATH"
    # Reuse the platform builds of the same recipe (Temporal, Caddy, Compose and
    # the patched bases). Only a direct run of this workflow uses the cache. In
    # a workflow_call from aws-release.yml, github.workflow is the caller, so
    # that run builds from source. Every image still goes through the scans.
    - name: Restore the platform builds of the same recipe
      if: ${{ github.workflow == 'AWS release checks' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/platform-builds
        key: platform-builds-v1-${{ hashFiles('delivery/maintained.py', 'deploy/aws/images.lock.json', 'deploy/aws/platform/**') }}
    - name: Run required images checks
      env:
        AGENTCLASH_PLATFORM_CACHE: ${{ github.workflow == 'AWS release checks' && format('{0}/platform-builds', runner.temp) || '' }}
      run: python3 delivery/checks.py images
  required:
    name: Release checks
    if: ${{ always() }}
    needs:
    - changes
    - backend
    - runtime
    - cli
    - terminal
    - frontend
    - platform
    - images
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require all selected checks
      env:
        CHECK_PLAN: ${{ needs.changes.outputs.plan }}
        CHECK_RESULTS: ${{ toJSON(needs) }}
      run: python3 delivery/changes.py aggregate
