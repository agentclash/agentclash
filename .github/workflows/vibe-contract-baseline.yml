name: Vibe interaction contracts and baseline
on:
  pull_request:
    paths:
      - 'backend/internal/vibe/**'
      - 'backend/internal/api/vibe*'
      - 'backend/db/migrations/**'
      - 'backend/go.*'
      - 'runtime/**'
      - 'scripts/vibe/**'
      - '.github/workflows/vibe-contract-baseline.yml'
      - 'backend/internal/enquiries/**'
      - 'backend/internal/email/**'
      - 'backend/internal/mutation/**'
      - 'backend/Dockerfile.worker'
      - 'backend/internal/api/runs*'
      - 'web/src/app/(workspace)/workspaces/*/runs/**'
      - 'backend/internal/api/regression*'
      - 'backend/internal/api/release_gate*'
      - 'backend/internal/api/github_integrations*'
      - 'backend/internal/api/routes.go'
      - 'backend/internal/repository/regression*'
      - 'backend/internal/repository/run*'
      - 'cli/cmd/ci*'
      - 'cli/cmd/evaltest*'
      - 'cli/go.*'
      - 'web/src/lib/ci-setup*'
      - 'web/src/app/(workspace)/workspaces/*/ci-setup/**'
      - 'web/src/components/challenge-packs/vibe-return*'
      - 'backend/internal/api/eval_session*'
      - 'backend/internal/api/eval_sets*'
      - 'backend/internal/repository/eval_session*'
      - 'backend/internal/engine/**'
      - 'backend/internal/api/connectors*'
      - 'backend/internal/repository/connector*'
      - 'backend/internal/worker/**'
      - 'backend/internal/workflow/**'
      - 'backend/internal/api/challenge_pack_generate_contract.go'
      - 'backend/internal/api/billing*'
      - 'backend/internal/api/config.go'
      - 'backend/internal/api/cors.go'
      - 'backend/internal/api/server.go'
      - 'backend/cmd/**'
      - 'web/src/app/vibe-evals/**'
      - 'web/src/components/vibe/**'
      - 'web/src/components/share/**'
      - 'web/src/components/app-shell/top-bar.tsx'
      - 'web/src/components/app-shell/nav-items.ts'
      - 'web/src/app/share/**'
      - 'web/src/app/(workspace)/workspaces/*/reports/**'
      - 'web/src/lib/report-snapshots.ts'
      - 'backend/internal/api/public_shares*'
      - 'backend/internal/repository/public_share*'
      - 'backend/internal/repository/report_snapshots*'
      - 'web/src/lib/vibe*'
      - 'web/src/lib/connector-client.ts'
      - 'web/src/lib/use-vibe-*'
      - 'web/e2e/vibe/**'
      - 'web/e2e/vibe-stack/**'
      - 'web/playwright.vibe.config.ts'
      - 'web/playwright.vibe-stack.config.ts'
      - 'web/package*.json'
      - '.github/workflows/vibe-evals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversation-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vibe_test_phase1
          POSTGRES_USER: vibe_test
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vibe_test -d vibe_test_phase1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VIBE_BROWSER_OWNERSHIP_LOG: /tmp/vibe-ownership.jsonl
      VIBE_TEST_DATABASE_URL: postgres://vibe_test:local_test_only@127.0.0.1:5432/vibe_test_phase1?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Offline contracts and quality-gate regressions
        run: |
          python3 -m unittest discover -s scripts/vibe -p 'test_*.py' -v
          python3 scripts/vibe/quality.py
      - name: Required database and contract sequences (no paid calls)
        run: python3 scripts/vibe/run_baseline.py --report /tmp/vibe-conversation-baseline.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vibe-conversation-regression-baseline
          path: |
            /tmp/vibe-conversation-baseline.json
            ${{ env.VIBE_BROWSER_OWNERSHIP_LOG }}
          if-no-files-found: error
