bind 0.0.0.0
port 0
tls-port 6379
tls-cert-file /run/secrets/server.crt
tls-key-file /run/secrets/server.key
tls-ca-cert-file /run/secrets/ca.pem
# Application clients use distinct ACL passwords and verify the server certificate.
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /run/secrets/users.acl
protected-mode yes
dir /data
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-load-truncated no
aof-use-rdb-preamble yes
save 300 1
stop-writes-on-bgsave-error yes
maxmemory 256mb
maxmemory-policy noeviction
maxclients 200
tcp-keepalive 60
loglevel warning
logfile ""
