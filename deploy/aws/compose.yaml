# Render using an explicit private --env-file. Never use the checkout's .env.
name: agentclash
x-common: &common
  platform: linux/amd64
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}
  tmpfs: [/tmp:rw,noexec,nosuid,size=64m,mode=1777]
services:
  caddy:
    <<: *common
    image: ${IMAGE_CADDY:?required}
    user: "10001:10001"
    mem_limit: 192m
    cap_add: [NET_BIND_SERVICE]
    stop_grace_period: 5m
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    ports: ["80:80", "443:443"]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SECRETS_ROOT:?required}/caddy:/run/secrets:ro
      - /run/agentclash/edge:/run/edge:ro
      - /var/lib/agentclash/caddy:/data
    networks:
      edge: {ipv4_address: 172.30.72.2}
  api:
    <<: *common
    image: ${IMAGE_API:?required}
    user: "10001:10001"
    mem_limit: 768m
    stop_grace_period: 45s
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [/app]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/api:/run/secrets:ro
    networks: [edge, data]
    healthcheck:
      test: [CMD, wget, -q, -T, "15", -O, /dev/null, http://127.0.0.1:8080/healthz/ready]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
  worker:
    <<: *common
    image: ${IMAGE_WORKER:?required}
    user: "10001:10001"
    mem_limit: 1536m
    stop_grace_period: 150s
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [/app]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/worker:/run/secrets:ro
    networks: [data]
  terminal:
    <<: *common
    image: ${IMAGE_TERMINAL:?required}
    user: "10001:10001"
    mem_limit: 768m
    stop_grace_period: 60s
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [bun, --no-install, --no-env-file, --preserve-symlinks, run, server/index.ts]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/terminal:/run/secrets:ro
    networks: [edge, data]
    healthcheck:
      test: [CMD, wget, -q, -T, "15", -O, /dev/null, http://127.0.0.1:3001/health/ready]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
  temporal:
    <<: *common
    image: ${IMAGE_TEMPORAL:?required}
    user: "1000:1000"
    mem_limit: 2560m
    stop_grace_period: 120s
    entrypoint: [/bin/sh, /opt/temporal-entrypoint.sh]
    volumes:
      - ./config/temporal-entrypoint.sh:/opt/temporal-entrypoint.sh:ro
      - ${SECRETS_ROOT}/temporal:/run/secrets:ro
    networks: [data]
  valkey:
    <<: *common
    image: ${IMAGE_VALKEY:?required}
    user: "999:999"
    mem_limit: 640m
    stop_grace_period: 60s
    entrypoint: [valkey-server]
    command: [/etc/valkey.conf]
    volumes:
      - ./config/valkey.conf:/etc/valkey.conf:ro
      - ${SECRETS_ROOT}/valkey:/run/secrets:ro
      - /var/lib/agentclash/cache:/data
    networks: [data]
  app-schema:
    <<: *common
    profiles: [admin]
    image: ${IMAGE_APP_SCHEMA:?required}
    user: "10001:10001"
    mem_limit: 256m
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [/migrator]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/app-schema:/run/secrets:ro
    networks: [data]
  temporal-schema:
    <<: *common
    profiles: [admin]
    image: ${IMAGE_TEMPORAL_ADMIN:?required}
    user: "1000:1000"
    mem_limit: 256m
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ./config/temporal-schema.sh:/opt/temporal-schema.sh:ro
      - ${SECRETS_ROOT}/temporal-schema:/run/secrets:ro
    networks: [data]
  temporal-admin:
    <<: *common
    profiles: [admin]
    image: ${IMAGE_TEMPORAL_ADMIN:?required}
    user: "1000:1000"
    mem_limit: 256m
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [temporal, operator, cluster, health]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/temporal-admin:/run/secrets:ro
    networks: [data]
  database-admin:
    <<: *common
    profiles: [admin]
    image: ${IMAGE_POSTGRES:?required}
    user: "1000:1000"
    mem_limit: 256m
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/database-admin:/run/secrets:ro
    networks: [data]
  cache-admin:
    <<: *common
    profiles: [admin]
    image: ${IMAGE_VALKEY:?required}
    user: "999:999"
    mem_limit: 128m
    entrypoint: [/bin/sh, /opt/secret-exec.sh]
    command: [valkey-cli, --tls, --cacert, /run/secrets/ca.pem, --user, admin, -h, valkey, PING]
    volumes:
      - ./config/secret-exec.sh:/opt/secret-exec.sh:ro
      - ${SECRETS_ROOT}/cache-admin:/run/secrets:ro
    networks: [data]
networks:
  # No host ports except Caddy. The outbound data bridge is needed for RDS/E2B/R2.
  # Host firewall blocks IMDS and lateral edge->data traffic outside attached services.
  edge:
    ipam:
      config: [{subnet: 172.30.72.0/24}]
  data:
    ipam:
      config: [{subnet: 172.30.73.0/24}]
